<style>
/* === Taller CrewAI — Estilos === */
:root{--paper:#f3f5f7;--ink:#192535;--muted:#596777;--line:#cbd2da;--accent:#b74c27;--peach:#f3c2a8;--white:#fff;--green:#2d8a56;--font:Archivo,Arial,Helvetica,sans-serif;--ease:cubic-bezier(.16,1,.3,1)}

/* Reset */
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);height:100dvh;overflow:hidden}::selection{background:var(--peach);color:var(--ink)}a{color:inherit;text-underline-offset:4px}button{font:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.3;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}svg{display:block}button svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}button{touch-action:manipulation}*{scrollbar-width:thin;scrollbar-color:var(--muted) var(--paper)}[hidden]{display:none!important}

/* Topbar */
.topbar{height:84px;margin:0 4.7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none;white-space:nowrap}
.brand svg{width:30px;height:30px;fill:var(--paper);stroke:var(--ink);stroke-width:1.8}
.brand b{font-size:23px;letter-spacing:-.04em}
.brand-divider{height:20px;border-left:1px solid var(--line);margin:0 8px}
.course,.header-right{font-size:13px}
.course{color:var(--muted)}
.header-right{display:flex;align-items:center;gap:28px}
.header-right>span{color:var(--muted)}
.quiet{border:0;background:transparent;display:flex;gap:9px;align-items:center;padding:12px 4px}
.quiet:hover{color:var(--accent)}

/* Stage */
#stage{height:calc(100dvh - 164px);padding:0 6.5%;overflow:auto;overscroll-behavior:contain}
.slide{min-height:100%;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding:32px 0 28px;gap:22px;animation:arrive .3s var(--ease)}
.slide h1,.slide h2,.slide h3,.slide h4,.slide p{margin:0}
.slide h1{font-size:clamp(58px,7vw,100px);font-weight:650;letter-spacing:-.04em;line-height:.95}
.slide h2{font-size:clamp(28px,3.5vw,50px);line-height:1.1;letter-spacing:-.03em;font-weight:600;text-wrap:balance;max-width:1100px}
.slide h3{font-size:clamp(19px,1.6vw,26px);line-height:1.2;letter-spacing:-.02em;font-weight:580}
.slide h4{font-size:17px;font-weight:600;letter-spacing:-.01em}
.lead{font-size:clamp(17px,1.6vw,24px);line-height:1.45;max-width:55ch;color:var(--muted)}
.accent{color:var(--accent)}

/* Hero */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.hero h1{margin-bottom:4px}
.hero-sub{font-size:clamp(22px,2.6vw,38px);font-weight:450;letter-spacing:-.03em;line-height:1.15;max-width:22ch}
.hero-meta{font-size:13px;color:var(--muted)}
.start-btn{border:0;border-radius:5px;padding:14px 24px;background:var(--ink);color:white;display:inline-flex;align-items:center;gap:16px;font-size:15px;font-weight:550}
.start-btn:hover{background:var(--accent)}
.start-btn svg{width:21px;height:21px;stroke:white;stroke-width:1.6;fill:none}

/* Code blocks + Copy */
pre{margin:0;background:var(--ink);color:#e3edf4;padding:18px 22px;overflow-x:auto;border-radius:5px;font-size:14.5px;line-height:1.6;tab-size:4;white-space:pre}
pre code{font-size:1em;font-family:'Cascadia Code',Consolas,'Courier New',monospace;color:inherit}
code{font-family:'Cascadia Code',Consolas,'Courier New',monospace;font-size:.87em}
.code-block{position:relative;margin:6px 0}
.copy-btn{position:absolute;top:7px;right:7px;width:32px;height:32px;border:0;border-radius:5px;background:rgba(255,255,255,.08);display:grid;place-items:center;z-index:2;transition:background .2s}
.copy-btn:hover{background:rgba(255,255,255,.2)}
.copy-btn svg{width:16px;height:16px;stroke:#9ab;stroke-width:2;fill:none}
.copy-btn.copied{background:var(--green)}
.copy-btn.copied svg{stroke:#fff}
.code-label{font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}

/* Accordion (details/summary) */
.accordion{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.accordion details{border:0;border-top:1px solid var(--line);margin:0;border-radius:0}
.accordion details:first-child{border-top:0}
.accordion summary{padding:13px 18px;cursor:pointer;font-weight:550;font-size:16px;list-style:none;display:flex;align-items:center;gap:10px;user-select:none;transition:background .15s}
.accordion summary:hover{background:rgba(0,0,0,.03)}
.accordion summary::before{content:"▸";font-size:13px;transition:transform .2s;color:var(--accent);font-family:monospace}
.accordion details[open] summary::before{transform:rotate(90deg)}
.accordion summary::-webkit-details-marker{display:none}
.accordion .detail-body{padding:4px 18px 16px}
.accordion .detail-body p{margin:6px 0;font-size:15px;line-height:1.5}

/* Tabs */
.tab-group{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:10px 0}
.tab-bar{display:flex;border-bottom:2px solid var(--line);background:#eaecef}
.tab-btn{flex:1;border:0;background:transparent;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn:hover{background:rgba(0,0,0,.03)}
.tab-btn.active{background:var(--white);border-bottom-color:var(--accent);color:var(--accent)}
.tab-panel{display:none;padding:18px 22px}
.tab-panel.active{display:block}
.tab-panel p{margin:6px 0;font-size:15px;line-height:1.5}

/* Checklist */
.checklist{list-style:none;padding:0;display:grid;gap:8px;margin:0}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:5px;font-size:16px;line-height:1.4;background:var(--white)}
.check-icon{width:20px;height:20px;border:2px solid var(--line);border-radius:4px;flex-shrink:0;margin-top:2px}

/* Directory tree */
.dir-tree{background:var(--ink);color:#e3edf4;padding:18px 22px;border-radius:5px;font-family:'Cascadia Code',Consolas,'Courier New',monospace;font-size:13.5px;line-height:1.85;overflow-x:auto;white-space:pre;margin:6px 0}
.dir-tree .hl{color:var(--peach)}

/* Note, Tip, Warning */
.note-box,.tip-box,.warn-box{padding:14px 18px;border-radius:5px;font-size:14.5px;line-height:1.55;margin:8px 0;display:flex;gap:10px;align-items:flex-start}
.note-box{background:#e8ecf0;border-left:4px solid var(--muted)}
.tip-box{background:#eaf5ee;border-left:4px solid var(--green)}
.warn-box{background:#fef6ee;border-left:4px solid #d48806}
.note-box .n-icon,.tip-box .n-icon,.warn-box .n-icon{font-size:18px;flex-shrink:0;line-height:1}

/* External links */
.ext{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.ext:hover{color:var(--ink)}

/* Layouts */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}

/* Slide end */
.slide-end{margin-top:auto;padding-top:8px}
.takeaway{font-size:14.5px;font-weight:550;line-height:1.5;max-width:60ch}
.takeaway::before{content:"";display:inline-block;width:18px;height:2px;background:var(--accent);vertical-align:middle;margin-right:10px}

/* 5 Pillars */
.parts{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:6px 0}
.parts>div{padding:16px 14px;border-right:1px solid var(--line)}
.parts>div:last-child{border-right:0}
.part-label{display:block;font-size:15px;color:var(--accent);font-weight:600;margin:10px 0 6px}
.parts p{font-size:14px;color:var(--muted);line-height:1.4;margin:0}
.parts .crew-part{background:var(--ink);color:white;padding-left:16px;padding-right:16px}
.crew-part .part-label{color:var(--peach)}
.crew-part p{color:#c5cfda}

/* Tables */
.slide table{border-collapse:collapse;width:100%}
.slide td,.slide th{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}

/* Toolbar */
.toolbar{height:80px;display:flex;align-items:center;justify-content:space-between;margin:0 4.7%;border-top:1px solid var(--line);gap:20px}
.progress-group,.tools{display:flex;align-items:center;gap:14px}
#counter{font-size:14px;font-variant-numeric:tabular-nums;min-width:57px;font-weight:600}
.progress-track{height:2px;width:110px;background:var(--line)}
#progress{height:100%;display:block;background:var(--accent);transition:width .3s}
.key-hint{color:var(--muted);font-size:12px;margin-left:15px}
.icon-button{width:42px;height:42px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center}
.icon-button:hover:not(:disabled){background:#e2e7ed}
.icon-button.next{background:var(--ink);color:#fff}
.icon-button.next:hover:not(:disabled){background:var(--accent)}
.control-divider{height:24px;border-left:1px solid var(--line);margin:0 6px}

/* Index */
#slide-index{position:absolute;z-index:5;top:84px;bottom:80px;right:0;left:0;background:var(--paper);padding:30px 6.5%;overflow:auto}
.index-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.index-heading h2{font-size:36px;letter-spacing:-.03em;margin:0}
#index-items{display:grid;grid-template-columns:repeat(3,1fr);column-gap:34px}
.index-item{background:transparent;border:0;border-top:1px solid var(--line);text-align:left;padding:20px 2px;display:flex;gap:18px;line-height:1.3;font-size:14px}
.index-item span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.index-item:hover,.index-item[aria-current]{color:var(--accent)}
.index-item[aria-current]{font-weight:650}

/* Accessibility & Toast */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);padding:15px 22px;background:var(--ink);color:white;border-radius:6px;z-index:10;font-size:14px;max-width:85vw}

/* Animation */
@keyframes arrive{from{transform:translateY(8px);opacity:.7}to{transform:translateY(0);opacity:1}}

/* ===== Responsive ===== */
@media(max-width:900px){
  .topbar{height:68px}
  .brand-divider,.course,.header-right>span,.key-hint{display:none}
  #stage{height:calc(100dvh - 140px)}
  .toolbar{height:72px}
  .progress-track{width:55px}
  .tools{gap:4px}
  #slide-index{top:68px;bottom:72px}
  #index-items{grid-template-columns:repeat(2,1fr)}
  .parts{grid-template-columns:repeat(3,1fr)}
  .parts>div:nth-child(3){border-right:0}
  .parts>div:nth-child(n+4){border-top:1px solid var(--line)}
  .parts>div:last-child{grid-column:span 2}
  .two-col{grid-template-columns:1fr}
  pre{font-size:13.5px;padding:16px 18px}
}
@media(max-width:600px){
  .topbar{margin:0 5%}
  .brand b{font-size:20px}
  .slide{padding:22px 0;gap:18px;justify-content:flex-start}
  .slide h1{font-size:48px}
  .hero-sub{font-size:22px}
  .lead{font-size:17px}
  .slide h2{font-size:26px}
  .slide h3{font-size:19px}
  pre{font-size:12.5px;padding:14px 12px}
  .dir-tree{font-size:12px;padding:14px 12px}
  .toolbar{margin:0 5%;gap:8px}
  .tools{gap:1px}
  .icon-button{width:37px;height:40px}
  .progress-track{width:38px}
  .progress-group{gap:9px}
  .control-divider{margin:0 3px}
  #counter{font-size:12px;min-width:45px}
  #index-items{grid-template-columns:1fr}
  .index-item{padding:16px 0}
  .parts{grid-template-columns:1fr 1fr}
  .parts>div:nth-child(odd){border-right:1px solid var(--line)}
  .parts>div:nth-child(even){border-right:0}
  .parts>div:nth-child(n+3){border-top:1px solid var(--line)}
  .parts>div:last-child{grid-column:span 2}
  .tab-bar{flex-direction:column}
  .tab-btn{text-align:left;border-bottom:0;border-left:3px solid transparent;margin:0}
  .tab-btn.active{border-left-color:var(--accent);border-bottom:0}
  .check-item{font-size:14px;padding:10px 12px}
  .two-col{grid-template-columns:1fr}
}
@media(max-height:650px) and (min-width:901px){
  .topbar{height:60px}
  .toolbar{height:64px}
  #stage{height:calc(100dvh - 124px)}
  .slide{gap:16px;padding:20px 0}
  .slide h2{font-size:36px}
  .slide h1{font-size:70px}
  .hero-sub{font-size:28px}
  .lead{font-size:20px}
  #slide-index{top:60px;bottom:64px}
  pre{font-size:13px;padding:14px 18px}
}
</style>
</head>

/* Helpers */
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function cmd(text){
  return '<div class="code-block"><button class="copy-btn" title="Copiar">'+iconCopy+'</button><pre><code>'+esc(text)+'</code></pre></div>';
}

function codeBlock(text,label){
  return (label?'<div class="code-label">'+label+'</div>':'')+
    '<div class="code-block"><button class="copy-btn" title="Copiar">'+iconCopy+'</button><pre><code>'+esc(text)+'</code></pre></div>';
}

function accordion(items){
  var h='<div class="accordion">';
  for(var i=0;i<items.length;i++){
    h+='<details><summary>'+items[i][0]+'</summary><div class="detail-body">'+items[i][1]+'</div></details>';
  }
  return h+'</div>';
}

function tabGroup(id,tabs){
  var h='<div class="tab-group"><div class="tab-bar" role="tablist">';
  for(var i=0;i<tabs.length;i++){
    h+='<button role="tab" class="tab-btn'+(i===0?' active':'')+'" data-tab="'+id+'-'+i+'">'+tabs[i].label+'</button>';

    h+='<div class="tab-panel'+(j===0?' active':'')+'" id="'+id+'-'+j+'" role="tabpanel">'+tabs[j].content+'</div>';
  }
  return h+'</div>';
}

function note(text){return '<div class="note-box"><span class="n-icon">📝</span><div>'+text+'</div></div>';}
function tip(text){return '<div class="tip-box"><span class="n-icon">💡</span><div>'+text+'</div></div>';}
function warn(text){return '<div class="warn-box"><span class="n-icon">⚠️</span><div>'+text+'</div></div>';}
function extLink(url,text){return '<a class="ext" href="'+url+'" target="_blank" rel="noopener">'+text+'</a>';}

// 14 — crew.py completo
{title:'crew.py completo',chapter:'Código',render:function(){return ''
  +'<h2>Código completo de <span class="accent">crew.py</span></h2>'
  +'<p class="lead">Reemplaza todo el contenido de <code>src/taller_crewai/crew.py</code>:</p>'
  +codeBlock(
    'from crewai import Agent, Crew, Process, Task\n'
   +'from crewai.project import CrewBase, agent, crew, task\n'
   +'from crewai.agents.agent_builder.base_agent import BaseAgent\n'
   +'from crewai.llm import LLM\n'
   +'\n'
   +'llm_llama3 = LLM(\n'
   +'    model="ollama/llama3.1",\n'
   +'    base_url="http://localhost:11434"\n'
   +')\n'
   +'llm_phi4 = LLM(\n'
   +'    model="ollama/phi4-mini",\n'
   +'    base_url="http://localhost:11434"\n'
   +')\n'
   +'\n'
   +'@CrewBase\n'
   +'class TallerCrewai():\n'
   +'    """TallerCrewai crew"""\n'
   +'\n'
   +'    agents: list[BaseAgent]\n'
   +'    tasks: list[Task]\n'
   +'\n'
   +'    @agent\n'
   +'    def investigador_tecnologias(self) -> Agent:\n'
   +'        return Agent(\n'
   +'            config=self.agents_config[\'investigador_tecnologias\'],\n'
   +'            verbose=True,\n'
   +'            llm=llm_llama3\n'
   +'        )\n'
   +'\n'
   +'    @agent\n'
   +'    def redactor_informe(self) -> Agent:\n'
   +'        return Agent(\n'
   +'            config=self.agents_config[\'redactor_informe\'],\n'
   +'            verbose=True,\n'
   +'            llm=llm_phi4\n'
   +'        )\n'
   +'\n'
   +'    @task\n'
   +'    def tarea_investigacion(self) -> Task:\n'
   +'        return Task(\n'
   +'            config=self.tasks_config[\'tarea_investigacion\'],\n'
   +'        )\n'
   +'\n'
   +'    @task\n'
   +'    def tarea_redaccion(self) -> Task:\n'
   +'        return Task(\n'
   +'            config=self.tasks_config[\'tarea_redaccion\'],\n'
   +'            output_file=\'informe.md\'\n'
   +'        )\n'
   +'\n'
   +'    @crew\n'
   +'    def crew(self) -> Crew:\n'
   +'        return Crew(\n'
   +'            agents=self.agents,\n'
   +'            tasks=self.tasks,\n'
   +'            process=Process.sequential,\n'
   +'            verbose=True,\n'
   +'        )'
  ,'src/taller_crewai/crew.py')
  +tip('<code>tools=[search_tool]</code> le da al investigador acceso a búsqueda web con Serper. El redactor no la necesita — recibe los hallazgos como contexto automáticamente por el <code>Process.sequential</code>.');
}},

/* === Taller CrewAI — Navegación y lógica === */
const iconArrow='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
const iconCopy='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

/* Portada (slide 0) */
const slides=[{
  title:'Tu primer equipo de agentes de IA',
  chapter:'Inicio',
  render:()=>'<div class="hero">'
    +'<h1>Taller CrewAI<span class="accent">.</span></h1>'
    +'<p class="hero-sub">Construye tu primer <span class="accent">equipo de agentes</span> de IA con modelos locales.</p>'
    +'<p class="lead">Guía paso a paso con CrewAI, Ollama y Serper.</p>'
    +'<button class="start-btn" data-next>Comenzar '+iconArrow+'</button>'
    +'<p class="hero-meta">Taller práctico · ~1 hora · Septiembre 2026</p>'
    +'</div>'
}];

slides.push(...makeSlides());

let current=0;let indexOpen=false;
const stage=document.getElementById('stage');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');

function navigate(n,updateHash){
  if(updateHash===undefined)updateHash=true;
  current=Math.min(Math.max(Number.isFinite(n)?Math.trunc(n):0,0),slides.length-1);
  var s=slides[current];
  stage.innerHTML='<section class="slide" aria-label="'+(current+1)+'. '+s.title+'">'+s.render()+'</section>';
  stage.scrollTop=0;
  document.getElementById('counter').textContent=String(current+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  document.getElementById('progress').style.width=((current+1)/slides.length*100)+'%';
  document.getElementById('chapter').textContent=s.chapter;
  prevBtn.disabled=current===0;
  nextBtn.disabled=current===slides.length-1;
  document.title=(current+1)+'. '+s.title+' — Taller CrewAI';
  document.getElementById('announcement').textContent='Diapositiva '+(current+1)+' de '+slides.length+': '+s.title;
  if(updateHash)history.replaceState(null,'','#'+(current+1));
  renderIndex();
}

function renderIndex(){
  var html='';
  for(var i=0;i<slides.length;i++){
    html+='<button class="index-item" data-slide="'+i+'"'+(i===current?' aria-current="page"':'')+'><span>'+String(i+1).padStart(2,'0')+'</span>'+slides[i].title+'</button>';
  }
  document.getElementById('index-items').innerHTML=html;
}

function toggleIndex(force){
  indexOpen=force!==undefined?force:!indexOpen;
  document.getElementById('slide-index').hidden=!indexOpen;
  document.getElementById('index-toggle').setAttribute('aria-expanded',String(indexOpen));
  stage.inert=indexOpen;
  if(indexOpen)document.getElementById('close-index').focus();
  else document.getElementById('index-toggle').focus();
}

function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.hidden=false;
  clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},4000);
}

function toggleFullscreen(){
  try{
    if(document.fullscreenElement)document.exitFullscreen();
    else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();
    else toast('Usa F11 para pantalla completa.');
  }catch(e){toast('No se pudo activar pantalla completa.');}
}

/* Copy code to clipboard */
function copyCode(btn){
  var code=btn.closest('.code-block').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(function(){
    btn.classList.add('copied');
    btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7" stroke-width="2"/></svg>';
    setTimeout(function(){
      btn.classList.remove('copied');
      btn.innerHTML=iconCopy;
    },2000);
  }).catch(function(){toast('No se pudo copiar. Selecciona el texto manualmente.');});
}

/* Event listeners */
prevBtn.addEventListener('click',function(){navigate(current-1)});
nextBtn.addEventListener('click',function(){navigate(current+1)});
document.getElementById('index-toggle').addEventListener('click',function(){toggleIndex()});
document.getElementById('close-index').addEventListener('click',function(){toggleIndex(false)});
document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-next],[data-slide]');
  if(b){
    if(b.hasAttribute('data-next'))navigate(current+1);
    else{navigate(Number(b.dataset.slide));toggleIndex(false);}
    return;
  }
  var copyBtn=e.target.closest('.copy-btn');
  if(copyBtn){copyCode(copyBtn);return;}
  /* Tabs */
  var tabBtn=e.target.closest('.tab-btn');
  if(tabBtn){
    var group=tabBtn.closest('.tab-group');
    var btns=group.querySelectorAll('.tab-btn');
    var panels=group.querySelectorAll('.tab-panel');
    for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
    for(var j=0;j<panels.length;j++)panels[j].classList.remove('active');
    tabBtn.classList.add('active');
    document.getElementById(tabBtn.dataset.tab).classList.add('active');
  }
});

document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,textarea,select'))return;
  if(e.key==='Escape'&&indexOpen){toggleIndex(false);return}
  if(e.key.toLowerCase()==='i'){e.preventDefault();toggleIndex();return}
  if(e.key.toLowerCase()==='f'){e.preventDefault();toggleFullscreen();return}
  if(indexOpen)return;
  if(e.target.closest('button,a')&&[' ','Enter'].indexOf(e.key)!==-1)return;
  if(['ArrowRight','ArrowDown','PageDown',' '].indexOf(e.key)!==-1){e.preventDefault();navigate(current+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].indexOf(e.key)!==-1){e.preventDefault();navigate(current-1)}
  if(e.key==='Home'){e.preventDefault();navigate(0)}
  if(e.key==='End'){e.preventDefault();navigate(slides.length-1)}
});

window.addEventListener('hashchange',function(){navigate((Number(location.hash.slice(1))||1)-1,false)});
document.addEventListener('fullscreenchange',function(){
  document.getElementById('fullscreen').setAttribute('aria-label',document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa');
});

var touchStart=null;
stage.addEventListener('touchstart',function(e){touchStart=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
stage.addEventListener('touchend',function(e){
  if(!touchStart||e.target.closest('button,a,pre,details'))return;
  var dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)navigate(current+(dx<0?1:-1));
  touchStart=null;
},{passive:true});

navigate((Number(location.hash.slice(1))||1)-1);
</script>
</body></html>
